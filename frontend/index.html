<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0B0F" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="AlphaStock Terminal — AI-native quantitative intelligence for the NIFTY 50. Predictions, regime detection, SHAP explainability, and portfolio optimization." />
    <title>AlphaStock Terminal · Quant Intelligence for NIFTY 50</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html { background: #0A0B0F; }
      body { margin: 0; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0A0B0F; z-index: 9999; transition: opacity .35s ease; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .mark { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      #boot .ring { width: 22px; height: 22px; border-radius: 999px; border: 2px solid #1F2533; border-top-color: #F4C45D; animation: spin .9s linear infinite; }
      #boot .label { font: 500 11px/1 'Inter',sans-serif; letter-spacing: .18em; color: #475569; text-transform: uppercase; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="mark"><div class="ring"></div><div class="label">AlphaStock Terminal</div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.addEventListener('load', () => {
        const b = document.getElementById('boot');
        if (b) setTimeout(() => { b.classList.add('gone'); setTimeout(() => b.remove(), 400); }, 120);
      });
    </script>
  </body>
</html>
